<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
<title id="t">Approval flow as a node graph</title><desc id="d">A node graph: an AI client proposes a plan to the MCP hub, a human reviews it in the Revit panel, and only then does the Revit add-in apply it in one named transaction. An IFC reader runs without Revit.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a13"/><stop offset="1" stop-color="#0b1424"/></linearGradient>
<radialGradient id="gt" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#14b8a6" stop-opacity=".34"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
<radialGradient id="gb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#7c93bd" fill-opacity=".2"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1200" height="340" rx="20"/></clipPath>

</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<g clip-path="url(#card)">
<rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#dots)"/>
<ellipse cx="900" cy="120" rx="380" ry="230" fill="url(#gt)"/><ellipse cx="260" cy="330" rx="340" ry="190" fill="url(#gb)"/>
<rect x="48" y="40" width="30" height="3" rx="1.5" fill="#2dd4bf"/><text x="48" y="68" class="m" font-size="12" letter-spacing="2.4" fill="#8fa3c7">BIM  ·  AEC AUTOMATION</text><g font-size="34" font-weight="800" fill="#e8eefc" letter-spacing="-.6"><text x="48" y="150">AI proposes.</text><text x="48" y="192">You approve.</text></g><text x="48" y="226" font-size="15" fill="#8fa3c7">Revit changes only after sign-off.</text><rect x="400" y="56" width="150" height="94" rx="10" fill="#0d1628" stroke="#2b3b57" stroke-width="1"/><path d="M400 66a10 10 0 0 1 10-10h130a10 10 0 0 1 10 10v14H400z" fill="#60a5fa" fill-opacity=".22"/><text x="414" y="78" class="m" font-size="12" font-weight="700" letter-spacing="1.2" fill="#60a5fa">AI CLIENT</text><text x="414" y="104" font-size="13" fill="#cbd5e8">Claude, Codex…</text><text x="414" y="128" font-size="13" fill="#cbd5e8">propose plan</text><rect x="400" y="200" width="150" height="70" rx="10" fill="#0d1628" stroke="#2b3b57" stroke-width="1"/><path d="M400 210a10 10 0 0 1 10-10h130a10 10 0 0 1 10 10v14H400z" fill="#a78bfa" fill-opacity=".22"/><text x="414" y="222" class="m" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a78bfa">IFC READER</text><text x="414" y="248" font-size="13" fill="#cbd5e8">no Revit needed</text><rect x="590" y="128" width="150" height="94" rx="10" fill="#0d1628" stroke="#2b3b57" stroke-width="1"/><path d="M590 138a10 10 0 0 1 10-10h130a10 10 0 0 1 10 10v14H590z" fill="#2dd4bf" fill-opacity=".22"/><text x="604" y="150" class="m" font-size="12" font-weight="700" letter-spacing="1.2" fill="#2dd4bf">MCP HUB</text><text x="604" y="176" font-size="13" fill="#cbd5e8">approval gate</text><text x="604" y="200" font-size="13" fill="#cbd5e8">routes tools</text><rect x="780" y="56" width="160" height="94" rx="10" fill="#0d1628" stroke="#f59e0b" stroke-width="1.6" filter="url(#glow)"/><path d="M780 66a10 10 0 0 1 10-10h140a10 10 0 0 1 10 10v14H780z" fill="#f59e0b" fill-opacity=".22"/><text x="794" y="78" class="m" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f59e0b">REVIEW</text><text x="794" y="104" font-size="13" fill="#cbd5e8">human approves</text><text x="794" y="128" font-size="13" fill="#cbd5e8">in Revit panel</text><rect x="980" y="128" width="160" height="94" rx="10" fill="#0d1628" stroke="#2b3b57" stroke-width="1"/><path d="M980 138a10 10 0 0 1 10-10h140a10 10 0 0 1 10 10v14H980z" fill="#2dd4bf" fill-opacity=".22"/><text x="994" y="150" class="m" font-size="12" font-weight="700" letter-spacing="1.2" fill="#2dd4bf">REVIT ADD-IN</text><text x="994" y="176" font-size="13" fill="#cbd5e8">one named</text><text x="994" y="200" font-size="13" fill="#cbd5e8">transaction</text><path d="M550 103.0 C570.0 103.0 570.0 175.0 590 175.0" fill="none" stroke="#60a5fa" stroke-opacity=".75" stroke-width="2"/><circle cx="550" cy="103.0" r="4" fill="#0b1424" stroke="#60a5fa" stroke-width="1.6"/><circle cx="590" cy="175.0" r="4" fill="#0b1424" stroke="#60a5fa" stroke-width="1.6"/><path d="M550 235.0 C570.0 235.0 570.0 175.0 590 175.0" fill="none" stroke="#a78bfa" stroke-opacity=".75" stroke-width="2" stroke-dasharray="5 5"/><circle cx="550" cy="235.0" r="4" fill="#0b1424" stroke="#a78bfa" stroke-width="1.6"/><circle cx="590" cy="175.0" r="4" fill="#0b1424" stroke="#a78bfa" stroke-width="1.6"/><path d="M740 175.0 C760.0 175.0 760.0 103.0 780 103.0" fill="none" stroke="#f59e0b" stroke-opacity=".75" stroke-width="2"/><circle cx="740" cy="175.0" r="4" fill="#0b1424" stroke="#f59e0b" stroke-width="1.6"/><circle cx="780" cy="103.0" r="4" fill="#0b1424" stroke="#f59e0b" stroke-width="1.6"/><path d="M940 103.0 C960.0 103.0 960.0 175.0 980 175.0" fill="none" stroke="#2dd4bf" stroke-opacity=".75" stroke-width="2"/><circle cx="940" cy="103.0" r="4" fill="#0b1424" stroke="#2dd4bf" stroke-width="1.6"/><circle cx="980" cy="175.0" r="4" fill="#0b1424" stroke="#2dd4bf" stroke-width="1.6"/>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>